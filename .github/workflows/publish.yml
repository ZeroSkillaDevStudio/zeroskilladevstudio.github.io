name: Publish ZeroSkilla Dev Studio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PUBLICATION_ENABLED != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          repository: k4mik4zz3-droid/zeroskilla-dev-studio
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test release selection
        run: node --test scripts/build-releases.test.mjs

      - name: Test local release publisher safety
        run: python3 scripts/test-local-publisher.py

      - name: Build latest verified download catalog directly from GitHub
        run: node scripts/build-releases.mjs
        env:
          RELEASE_REPOSITORY: k4mik4zz3-droid/zeroskilla-dev-studio
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
